<!-- web/contact.html -->
<!DOCTYPE html>
<html lang="nl" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5" style="max-width: 640px;">
    <h1 class="h3 mb-4">Neem contact op</h1>

    <div id="form-status" class="mb-3" role="status" aria-live="polite"></div>

    <form id="contact-form" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Naam</label>
        <input type="text" class="form-control" id="name" name="name" maxlength="100" required autocomplete="name">
        <div class="invalid-feedback" id="name-error"></div>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Bericht</label>
        <textarea class="form-control" id="message" name="message" rows="6" maxlength="2000" required></textarea>
        <div class="invalid-feedback" id="message-error"></div>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-button">Versturen</button>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="contact.js"></script>
</body>
</html>
